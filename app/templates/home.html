<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Stocks</title>
   <script src="https://cdn.tailwindcss.com"></script>
   <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
   <link rel="stylesheet" href="static/css/styles.css">
</head>
<body class="bg-white text-black min-h-screen flex flex-col">

   <!-- Header -->
   <header class="bg-gray-300 p-4 shadow-md">
      <div class="container mx-auto flex items-center justify-between">
         <h1 class="text-xl font-bold"><a href="/"> Stocks </a> </h1>
         <nav>
            <a href="/" class="text-gray-700 hover:text-black px-4">Home</a>
            <a href="/analysis" class="text-gray-700 hover:text-black px-4">Stock Analysis</a>
            <a href="/follow" class="text-gray-700 hover:text-black px-4">Follow Stocks</a>
            <a href="/battle" class="text-gray-700 hover:text-black px-4">Stock Battle</a>
            <button onclick="toggleHidden('settings')" class="text-gray-700 hover:text-black px-4">Account Settings</button>
         </nav>
      </div>
   </header>

   <!-- Main Content -->
   <main>
      <div class="min-h-screen flex items-center justify-center bg-gray-200 p-8">
         <div class="text-center max-w-7xl w-full bg-gray-100 p-10 rounded-lg shadow-2xl">
            <!-- Header -->
            <h2 class="text-8xl font-bold text-black mt-10 mb-10 tracking-wider">
               Welcome to Stocks!
            </h2>
            <!-- User Greeting -->
            {% if logged_in %}
            <p class="text-3xl text-gray-700 mb-4">Hi, {{username}}!</p>
            {% else %}
            <p class="text-3xl text-gray-700 mb-4">Hi!</p>
            {% endif %}
            <!-- Description -->
            <p class="text-gray-500 text-xl mb-8">
               Look at some STOCKS
            </p>
         </div>
      </div>
   </main>

   <!-- Register  -->
   <div id="register" class="fixed inset-0 bg-black bg-opacity-70 hidden flex items-center justify-center">
      <div class="bg-gray-100 p-6 rounded shadow-lg w-96">
         <h3 class="text-2xl font-bold mb-4">Register</h3>
         <form action="/register" method="POST" class="space-y-4">
            <div>
               <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
               <input type="text" id="username" name="username" class="w-full px-3 py-2 bg-gray-300 text-black rounded" required>
            </div>
            <div>
               <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
               <input type="password" id="password" name="password" class="w-full px-3 py-2 bg-gray-300 text-black rounded" required>
            </div>
            <div>
               <label for="password2" class="block text-sm font-medium text-gray-700">Confirm Password</label>
               <input type="password" id="password2" name="password2" class="w-full px-3 py-2 bg-gray-300 text-black rounded" required>
            </div>
            <div class="flex justify-between items-center">
               <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded">Register</button>
               <button type="button" onclick="toggleHidden('register')" class="text-gray-500 hover:text-black">Cancel</button>
            </div>
         </form>
      </div>
   </div>

   <!-- Log In  -->
   <div id="login" class="fixed inset-0 bg-black bg-opacity-30 hidden flex items-center justify-center">
      <div class="bg-gray-100 p-6 rounded shadow-lg w-96">
         <h3 class="text-2xl font-bold mb-4">Log In</h3>
         <form action="/login" method="POST" class="space-y-4">
            <div>
               <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
               <input type="text" id="username" name="username" class="w-full px-3 py-2 bg-gray-300 text-black rounded" required>
            </div>
            <div>
               <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
               <input type="password" id="password" name="password" class="w-full px-3 py-2 bg-gray-300 text-black rounded" required>
            </div>
            <div class="flex justify-between items-center">
               <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded">Log In</button>
               <button type="button" onclick="toggleHidden('login')" class="text-gray-500 hover:text-black">Cancel</button>
            </div>
         </form>
      </div>
   </div>

   <!-- Account Settings  -->
   <div id="settings" class="fixed inset-0 bg-black bg-opacity-70 hidden flex items-center justify-center">
      <div class="bg-gray-300 p-6 rounded shadow-lg w-96">
         <h3 class="text-2xl font-bold mb-4">Account Settings</h3>
         {% if logged_in %}
         <form action="/mode_swap" method="POST" class="space-y-4">
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded">Swap Screen Color</button>
         </form>
         {% else %}
         <h3 class="text-2xl font-bold mb-4">Log in first!</h3>
         {% endif %}
         <div class="flex justify-between items-center">
            <button type="button" onclick="toggleHidden('settings')" class="text-gray-600 hover:text-black">Cancel</button>
         </div>
      </div>
   </div>

   <!-- Footer -->
   <footer class="bg-gray-300 p-4 text-center">
      <p class="text-gray-700 text-sm">&copy; 2025 Stocks. All rights reserved.</p>
   </footer>

   <script src="static/js/scripts.js"></script>
</body>
</html>
